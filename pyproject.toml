[project]
name = "cscience-py-features-net-connector"
version = "0.1.0"
description = "Connector for exposing CScience Python features to .NET."
requires-python = ">=3.13,<3.14"
dependencies = [
    "cscience-feature-api",
    "cscience-feature-asr-whisper",
    "cscience-feature-clip",
    "cscience-feature-clip-spatial",
    "cscience-feature-nsfw-image",
    "cscience-feature-ocr-tesseract",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv.sources.cscience-feature-api]
git = "ssh://git@github.com/net-cscience/cscience-py-features-core.git"
branch = "main"
subdirectory = "packages/cscience-feature-api"

[tool.uv.sources.cscience-feature-api-maintanance]
git = "ssh://git@github.com/net-cscience/cscience-py-features-core.git"
branch = "main"
subdirectory = "packages/cscience-feature-api-maintanance"

[tool.uv.sources.cscience-feature-asr-whisper]
git = "ssh://git@github.com/net-cscience/cscience-py-features-core.git"
branch = "main"
subdirectory = "packages/cscience-feature-asr-whisper"

[tool.uv.sources.cscience-feature-clip]
git = "ssh://git@github.com/net-cscience/cscience-py-features-core.git"
branch = "main"
subdirectory = "packages/cscience-feature-clip"

[tool.uv.sources.cscience-feature-clip-spatial]
git = "ssh://git@github.com/net-cscience/cscience-py-features-core.git"
branch = "main"
subdirectory = "packages/cscience-feature-clip-spatial"

[tool.uv.sources.cscience-feature-nsfw-image]
git = "ssh://git@github.com/net-cscience/cscience-py-features-core.git"
branch = "main"
subdirectory = "packages/cscience-feature-nsfw-image"

[tool.uv.sources.cscience-feature-ocr-tesseract]
git = "ssh://git@github.com/net-cscience/cscience-py-features-core.git"
branch = "main"
subdirectory = "packages/cscience-feature-ocr-tesseract"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cscience"]